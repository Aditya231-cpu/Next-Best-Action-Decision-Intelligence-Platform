[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "next-best-action-platform"
version = "0.1.0"
description = "Causal and constrained next-best-action decision intelligence"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "scikit-learn>=1.3", "PyYAML>=6.0", "pyarrow>=14.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "fastapi>=0.110", "httpx>=0.27", "SQLAlchemy>=2.0"]
causal = ["scikit-learn>=1.3", "econml>=0.15", "dowhy>=0.11"]
service = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "sqlalchemy>=2.0", "pydantic>=2.0"]
dashboard = ["streamlit>=1.32", "SQLAlchemy>=2.0"]
optimization = ["ortools>=9.8"]
tracking = ["mlflow>=2.10"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["nba*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
